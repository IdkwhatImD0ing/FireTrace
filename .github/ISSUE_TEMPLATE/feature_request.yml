name: Feature request
description: Propose a change to FireTrace
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Two things are out of scope by design and will not be accepted: any age-based deletion of trace data (TTLs, cleanup jobs), and any direct client access to Firestore. Everything else is open for discussion.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that FireTrace makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see? API shape, UI sketch, or a pointer to how another tool does it.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Dashboard
        - Ingestion / data model
        - REST API
        - MCP server
        - SDK
        - Deployment / docs
