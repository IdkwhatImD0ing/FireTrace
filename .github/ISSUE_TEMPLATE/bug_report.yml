name: Bug report
description: Something in the dashboard, the API, the SDK, or the MCP server misbehaves
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **never paste API keys, service-account JSON, the key pepper, or trace contents** here. Ids, status codes, and the `requestId` from an error response are enough.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a key with scopes ...
        2. Call `GET /api/v1/traces?status=error`
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      multiple: true
      options:
        - Dashboard (browser)
        - REST API (/api/v1)
        - MCP endpoint (/api/mcp) or stdio bridge
        - TypeScript SDK (@firetrace/sdk)
        - Local development / emulators
        - Vercel deployment / Firebase setup
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.2.0 or a commit sha
  - type: textarea
    id: logs
    attributes:
      label: Logs or error response
      description: Vercel function logs are single-line JSON with a `requestId`; the API error envelope has `code`, `message`, and `requestId`.
      render: text
